<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed && !mobile" [class.sidebar-open]="sidebarOpen" [class.mobile-layout]="mobile">
  <div class="scrim" (click)="closeSidebar()" aria-hidden="true"></div>
  <app-sidebar [mobile]="mobile" [open]="sidebarOpen" [collapsed]="sidebarCollapsed" [primary]="primaryNav()" [academic]="academicNav()" [configuration]="auth.canAccess('configuracion')" (toggled)="toggleSidebar()" (navigated)="closeSidebar()" (signedOut)="logout()" />
  <div class="main-area" [attr.inert]="mobile && sidebarOpen ? '' : null"><app-navbar [title]="title" [user]="auth.currentUser()" (menuClicked)="toggleSidebar()" /><main class="page-content"><router-outlet /></main><footer class="app-footer"><span>SIGEV · I.E. Virgen Dolorosa</span><span>PAZ Y BIEN</span></footer></div>
</div>

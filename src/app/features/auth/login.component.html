<main class="login-page">
  <section class="login-card" aria-label="Acceso a SIGEV">
    <aside class="brand-panel">
      <div class="brand-content">
        <div class="crest"><img src="logo-virgen-dolorosa.png" alt="Escudo del colegio Virgen Dolorosa" /></div>
        <div class="brand-name"><span class="brand-heading">SIGEV</span><p>I.E. Virgen Dolorosa</p></div>
      </div>
    </aside>

    <section class="form-panel">
      <header class="welcome-copy"><h1>Iniciar sesión</h1></header>
      <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="input-shell" [class.invalid]="submitted && loginForm.controls.email.invalid">
            <svg lucideMail [size]="18"></svg>
            <input id="email" type="email" formControlName="email" autocomplete="username" spellcheck="false" [attr.aria-invalid]="submitted && loginForm.controls.email.invalid" aria-describedby="email-error" />
          </div>
          <small id="email-error" class="error" *ngIf="submitted && loginForm.controls.email.invalid">Ingresa un correo electrónico válido.</small>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-shell" [class.invalid]="submitted && loginForm.controls.password.invalid">
            <svg lucideLockKeyhole [size]="18"></svg>
            <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password" [attr.aria-invalid]="submitted && loginForm.controls.password.invalid" aria-describedby="password-error" />
            <button type="button" class="icon-button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.aria-pressed]="showPassword">
              <svg lucideEyeOff *ngIf="showPassword" [size]="18"></svg><svg lucideEye *ngIf="!showPassword" [size]="18"></svg>
            </button>
          </div>
          <small id="password-error" class="error" *ngIf="submitted && loginForm.controls.password.invalid">La contraseña debe tener al menos 6 caracteres.</small>
        </div>
        <button type="button" class="recovery-link" (click)="recoveryVisible = !recoveryVisible" [attr.aria-expanded]="recoveryVisible">¿Olvidaste tu contraseña?</button>
        <p *ngIf="recoveryVisible" class="recovery-note" role="status">Contacta con secretaría para recuperar el acceso.</p>
        <p *ngIf="loginError" class="error" role="alert">{{ loginError }}</p>
        <button class="submit-button" type="submit">Ingresar <svg lucideLogIn [size]="18"></svg></button>
      </form>
      <p class="support-copy"><a href="mailto:vdsecretaria@virgendolorosatarapoto.edu.pe">Contactar con secretaría</a></p>
    </section>
  </section>
</main>
